# ==========================================
# Eclipse Mosquitto Configuration
# Digital Twin Message Transport
# ==========================================

# Standard MQTT listener
listener 1883 0.0.0.0
protocol mqtt

# WebSockets listener for direct browser/UI events
listener 9001 0.0.0.0
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Authentication & Authorization: reject anonymous connections and enforce ACLs
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file
