# ==========================================
# Eclipse Mosquitto Configuration
# Digital Twin Message Transport
# ==========================================

# Standard MQTT listener
listener 1883 0.0.0.0
protocol mqtt

# WebSockets listener for direct browser/UI events
listener 9001 0.0.0.0
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Authentication: allow anonymous for development convenience
allow_anonymous true
